<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <header>
      <div class="header-logo">
        <img src="logo.jpg" alt="" />
      </div>
    </header>
    <div class="main-visual">
      <picture>
        <source media="(max-width:768px )" srcset="main-visual-sp.jpg" />
        <img src="main-visual.jpg" alt="" />
      </picture>
    </div>
    <nav>
      <ul class="nav-list">
        <li class="nav-item"><a href="">menu</a></li>
        <li class="nav-item"><a href="">blog</a></li>
        <li class="nav-item"><a href="">access</a></li>
      </ul>
    </nav>
    <div class="content">
      <div class="concept">
        <div class="container concept-container">
          <div class="concept-left">
            <div class="concept-image">
              <picture class="concept-picture">
                <img src="concept.jpg" alt="" />
              </picture>
            </div>
          </div>
          <div class="concept-right">
            <p class="concept-text">Concept</p>
            <h2 class="concept-heading">心静かにコーヒーを</h2>
            <p class="concept-discription">
              立ち止まって、<br />
              空の青さを眺めて、<br />
              一息つきましょう
            </p>
          </div>
        </div>
      </div>
      <div class="blog">
        <div class="container">
          <div class="blog-section">
            <h2 class="blog-title-en">blog</h2>
            <p class="blog-title-jp">ブログ</p>
          </div>
          <div class="container-inner">
            <div class="item">
              <img src="thumbnail01.jpg" alt="" />
              <h3>コーヒーカー始めました。</h3>
              <p class="date">2030.08.08</p>
            </div>
            <div class="item">
              <img src="thumbnail02.jpg" alt="" />
              <h3>濃厚クリーミーなミルクをどうぞ</h3>
              <p class="date">2030.08.05</p>
            </div>
            <div class="item">
              <img src="thumbnail03.jpg" alt="" />
              <h3>
                Sky Coffeeのオリジナル曲が完成！無料ダウンロード可能です。
              </h3>
              <p class="date">2030.08.02</p>
            </div>
            <div class="item">
              <img src="thumbnail04.jpg" alt="" />
              <h3>ハイキング用のコーヒーを販売中です。</h3>
              <p class="date">2030.07.28</p>
            </div>
            <div class="item">
              <img src="thumbnail05.jpg" alt="" />
              <h3>ショップの壁を塗ってみました。</h3>
              <p class="date">2030.07.27</p>
            </div>
            <div class="item">
              <img src="thumbnail06.jpg" alt="" />
              <h3>ブログをはじめました。</h3>
              <p class="date">2030.07.26</p>
            </div>
          </div>
          <div class="button-container">
            <a href="" class="blog-button">ブログ一覧</a>
          </div>
        </div>
      </div>
    </div>
    <footer>
      <div class="footer-container">
        <img class="footer-logo" src="logo-white (1).png" alt="" />
        <p class="copy">&copy;Sky Coffee</p>
      </div>
    </footer>
  </body>
</html>
